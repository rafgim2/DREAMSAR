<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Dreams AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    @font-face {
      font-family: 'PristinaAR';
      src: url('PRISTINA.TTF') format('truetype');
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'PristinaAR', serif;
      background: radial-gradient(circle at top, #1a1a1a, #000);
      color: #f2f2f2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      padding: 42px 20px 8px;
      width: 100%;
      max-width: 980px;
    }

    .logo-frame {
      display: inline-block;
      padding: 4px;
      border-radius: 22px;
      background: linear-gradient(
        180deg,
        rgba(255, 210, 120, 0.95),
        rgba(200, 150, 60, 0.95)
      );
      box-shadow:
        0 12px 30px rgba(255, 180, 80, 0.35),
        0 0 0 1px rgba(255, 220, 160, 0.35);
    }

    .logo {
      width: min(450px, 92vw);
      border-radius: 18px;
    }

    .panel {
      position: relative;
      width: min(1000px, 92vw);
      margin: 34px 0 22px;
      padding: 18px;
      border-radius: 18px;
      background: linear-gradient(
        180deg,
        rgba(0,0,0,0.06) 0%,
        rgba(0,0,0,0.20) 18%,
        rgba(0,0,0,0.35) 42%,
        rgba(0,0,0,0.35) 100%
      );
      box-shadow: 0 15px 40px rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
      overflow: visible;
    }

    .panel::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: -40px;
      height: 55px;
      border-radius: 30px 30px 0 0;
      background: linear-gradient(
        180deg,
        rgba(255, 190, 90, 0.08) 0%,
        rgba(0,0,0,0.12) 35%,
        rgba(0,0,0,0) 100%
      );
      filter: blur(10px);
      pointer-events: none;
    }

    .panel h2 {
      font-size: 1.8rem;
      text-align: center;
      margin-bottom: 12px;
      margin-top: -20px;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
    }

    .choice {
      cursor: pointer;
      border-radius: 12px;
      border: 1px solid rgba(255, 200, 120, 0.25);
      background: linear-gradient(
        180deg,
        rgba(90, 60, 20, 0.55),
        rgba(40, 25, 10, 0.75)
      );
      padding: 10px;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      text-align: center;
      min-height: 100px;

      transition: 0.25s;
    }

    .choice:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(255, 180, 80, 0.25);
    }

    .choice.selected {
      border-color: rgba(255, 200, 80, 0.9);
      box-shadow: 0 15px 40px rgba(255, 190, 90, 0.45);
    }

    .choice-title {
      font-size: 1.4rem;
      margin-bottom: 4px;
    }

    .choice-sub {
      font-family: system-ui;
      font-size: 0.8rem;
      opacity: 0.7;
    }

    .actions {
      display: flex;
      justify-content: center;
      margin-top: 14px;
    }

    .btn {
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(
        180deg,
        rgba(255, 210, 120, 0.95),
        rgba(200, 150, 60, 0.95)
      );
      color: #1a1208;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    footer {
      opacity: 0.5;
      font-size: 1.2rem;
      padding: 10px;
      margin-top: -20px;
    }
  </style>
</head>

<body>

<header>
  <div class="logo-frame">
    <img class="logo" src="DREAMSAR.png" />
  </div>
</header>

<main class="panel">
  <h2>Elige tu canción:</h2>

  <section class="choices">
    <div class="choice" data-url="https://rafgim2.github.io/F1MAINTHEME">
      <div class="choice-title">F1 Main Theme</div>
      <div class="choice-sub"></div>
    </div>

    <div class="choice" data-url="https://rafgim2.github.io/BAJOELMISMOCIELO">
      <div class="choice-title">Bajo el mismo cielo</div>
      <div class="choice-sub">Entrar en AR</div>
    </div>

    <div class="choice" data-url="https://rafgim2.github.io/Dreamn14">
      <div class="choice-title">Dream nº14</div>
      <div class="choice-sub">Entrar en AR</div>
    </div>

    <div class="choice" data-url="https://rafgim2.github.io/BROKENNOTE">
      <div class="choice-title">Broken Note</div>
      <div class="choice-sub">Entrar en AR</div>
    </div>

    <div class="choice" data-url="https://rafgim2.github.io/Dreamn7/">
      <div class="choice-title">Dream nº7</div>
      <div class="choice-sub">Entrar en AR</div>
    </div>
  </section>

  <div class="actions">
    <button id="enterBtn" class="btn" disabled>Acceder</button>
  </div>
</main>

<footer>
  © By Rafael Gimeno
</footer>

<script>
  const choices = document.querySelectorAll('.choice');
  const enterBtn = document.getElementById('enterBtn');

  let selectedUrl = null;

  choices.forEach(choice => {
    choice.addEventListener('click', () => {
      choices.forEach(c => c.classList.remove('selected'));
      choice.classList.add('selected');
      selectedUrl = choice.dataset.url;
      enterBtn.disabled = false;
    });
  });

  enterBtn.addEventListener('click', () => {
    if (selectedUrl) {
      window.location.href = selectedUrl;
    }
  });
</script>

</body>
</html>
